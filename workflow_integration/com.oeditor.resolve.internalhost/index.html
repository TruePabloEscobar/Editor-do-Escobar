<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EDE — Editor Do Escobar</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="renderer.js" defer></script>
  </head>
  <body>
    <main>
      <h1>EDE — Editor Do Escobar</h1>
      <p>Integração com o DaVinci Resolve Studio</p>
      <button id="open-editor" type="button">Abrir ou trazer o EDE para frente</button>
      <p id="editor-detail" role="status" aria-live="polite">Preparando a abertura do editor…</p>
      <p id="status" class="status">STARTING</p>
      <p id="detail">Inicializando host persistente…</p>
      <p id="metadata" class="metadata"></p>
      <p class="notice">
        Abrir esta integração não aplica alterações à timeline.
      </p>
    </main>
  </body>
</html>
