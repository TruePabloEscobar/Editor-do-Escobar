name: Regressao Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Ambiente Python
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -e ".[dev,whisper]" -c requirements/runtime-windows.txt
      - name: Gate sem Resolve e sem downloads de modelos
        run: .venv/Scripts/python.exe scripts/run_regression.py
      - name: Artefato de plugin
        run: .venv/Scripts/python.exe scripts/package_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-windows
          path: |
            runtime/regression/*/report.json
            runtime/regression/*/junit.xml
            runtime/regression/*/coverage.xml
            runtime/regression/*/*.log
            dist/*.zip
            dist/*.sha256
