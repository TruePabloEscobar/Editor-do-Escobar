[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "o-editor"
version = "0.2.0"
description = "Assistente local de edição para DaVinci Resolve"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Pablo Escobar" }]
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1,<2", "numpy>=1.24", "huggingface-hub>=0.24,<2"]
dev = [
  "pip>=26.2",
  "setuptools>=83",
  "lupa>=2.6,<3",
  "numpy>=1.24",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
all = ["o-editor[whisper,dev]"]

[project.scripts]
o-editor = "o_editor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
o_editor = ["ui/assets/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"launcher/O Editor.py" = ["UP"]
"launcher/legacy/O Editor.py" = ["UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["o_editor"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "faster_whisper.*", "ctranslate2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --basetemp=runtime/pytest-tmp -q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "resolve: requer uma instância real do DaVinci Resolve",
]

[tool.coverage.run]
source = ["o_editor.domain", "o_editor.application"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
